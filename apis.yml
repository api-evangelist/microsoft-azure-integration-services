- aid: microsoft-azure-integration-services:azure-logic-apps
  name: Azure Logic Apps
  description: >-
    Azure Logic Apps is a cloud-based platform for creating and running automated workflows that integrate
    apps, data, services, and systems. It provides a visual designer and hundreds of pre-built connectors
    to build workflows without writing code, enabling business process automation and enterprise integration
    scenarios.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
