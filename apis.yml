- aid: microsoft-azure-integration-services:azure-event-grid
  name: Azure Event Grid
  description: >-
    Azure Event Grid is a highly scalable, fully managed publish-subscribe event distribution service.
    It enables event-driven architectures by routing events from Azure services and custom sources to
    event handlers such as Azure Functions, Logic Apps, and webhooks, with support for filtering and fanout.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://learn.microsoft.com/en-us/azure/event-grid/
