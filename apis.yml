- aid: microsoft-azure-integration-services:azure-event-hubs
  name: Azure Event Hubs
  description: >-
    Azure Event Hubs is a big data streaming platform and event ingestion service capable of receiving
    and processing millions of events per second. It is used for telemetry ingestion, application logging,
    and real-time analytics pipelines, with support for Apache Kafka protocol, AMQP, and HTTPS.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://learn.microsoft.com/en-us/azure/event-hubs/
