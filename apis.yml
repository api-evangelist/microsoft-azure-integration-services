aid: microsoft-azure-integration-services
name: Microsoft Azure Integration Services
description: >-
  Microsoft Azure Integration Services is a collection of cloud-based integration capabilities that connect
  applications, data, and processes across cloud and on-premises environments. It includes API Management, Logic Apps,
  Service Bus, Event Grid, and Event Hubs to enable enterprise integration, messaging, and event-driven architectures.
